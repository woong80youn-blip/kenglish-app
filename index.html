<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>키위엔 영어회화 - 나만의 문장 만들기</title>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary-purple: #7942ed;
            --light-purple: #905cf4;
            --card-purple: #6a32df;
            --bg-color: #f4f0ff;
            --text-main: #333333;
            --white: #ffffff;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Noto Sans KR', sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 30px 20px;
        }

        .container {
            width: 100%;
            max-width: 700px;
            background: var(--primary-purple);
            border-radius: 24px;
            box-shadow: 0 10px 30px rgba(121, 66, 237, 0.3);
            padding: 30px;
            color: var(--white);
        }

        header {
            text-align: center;
            margin-bottom: 25px;
        }

        header p {
            font-size: 0.9rem;
            opacity: 0.85;
            margin-bottom: 4px;
        }

        header h1 {
            font-size: 1.6rem;
            font-weight: 700;
            margin-bottom: 8px;
            letter-spacing: -0.5px;
        }

        /* 제어 패널 박스 스타일 */
        .control-box {
            background: var(--card-purple);
            padding: 18px 20px;
            border-radius: 16px;
            margin-bottom: 25px;
            box-shadow: inset 0 2px 5px rgba(0,0,0,0.1);
        }

        .control-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
        }

        .control-header .title {
            font-size: 0.95rem;
            font-weight: 500;
        }

        .btn-group {
            display: flex;
            gap: 6px;
            flex-wrap: wrap;
        }

        .top-btn {
            background: rgba(255, 255, 255, 0.2);
            color: var(--white);
            border: none;
            padding: 6px 12px;
            border-radius: 8px;
            font-size: 0.8rem;
            cursor: pointer;
            transition: background 0.2s;
        }

        .top-btn:hover {
            background: rgba(255, 255, 255, 0.35);
        }

        .top-btn.active {
            background: var(--white);
            color: var(--primary-purple);
            font-weight: 700;
        }

        .checkbox-group {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
            max-height: 120px;
            overflow-y: auto;
            padding-right: 5px;
            margin-bottom: 15px;
        }

        .checkbox-label {
            display: flex;
            align-items: center;
            gap: 5px;
            background: rgba(255, 255, 255, 0.15);
            padding: 5px 10px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 0.8rem;
            font-weight: 500;
            transition: background 0.2s;
        }

        .checkbox-label:hover {
            background: rgba(255, 255, 255, 0.25);
        }

        .checkbox-label input {
            accent-color: var(--primary-purple);
            width: 14px;
            height: 14px;
            cursor: pointer;
        }

        /* 문제 수 조절 및 슬라이더 영역 */
        .count-control-container {
            border-top: 1px solid rgba(255, 255, 255, 0.15);
            padding-top: 15px;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .count-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .stepper-group {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .stepper-btn {
            background: var(--white);
            color: var(--primary-purple);
            border: none;
            width: 32px;
            height: 32px;
            border-radius: 8px;
            font-weight: 700;
            font-size: 1rem;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: background 0.2s;
        }

        .stepper-btn:hover {
            background: #f0ebff;
        }

        #countDisplay {
            font-weight: 700;
            font-size: 1rem;
            min-width: 40px;
            text-align: center;
        }

        .range-slider-container {
            display: flex;
            align-items: center;
            gap: 12px;
            width: 100%;
        }

        input[type="range"] {
            flex: 1;
            accent-color: var(--white);
            cursor: pointer;
            height: 6px;
            border-radius: 3px;
            background: rgba(255, 255, 255, 0.3);
            outline: none;
        }

        .quiz-list {
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .quiz-card {
            background: var(--card-purple);
            border-radius: 18px;
            padding: 20px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.15);
        }

        .badge-group {
            display: flex;
            gap: 8px;
            margin-bottom: 10px;
            flex-wrap: wrap;
        }

        .badge {
            display: inline-block;
            background: rgba(255, 255, 255, 0.2);
            padding: 4px 10px;
            border-radius: 20px;
            font-size: 0.75rem;
            font-weight: 500;
        }

        .badge-unit {
            background: rgba(255, 255, 255, 0.35);
            font-weight: 700;
        }

        .question-text {
            font-size: 1.05rem;
            font-weight: 700;
            margin-bottom: 15px;
            line-height: 1.4;
        }

        .study-answer-box {
            background: rgba(255, 255, 255, 0.2);
            padding: 12px 15px;
            border-radius: 10px;
            font-size: 0.95rem;
            font-weight: 500;
            color: #fff;
            border-left: 4px solid var(--white);
        }

        .input-group {
            display: flex;
            gap: 10px;
            margin-bottom: 10px;
        }

        input[type="text"] {
            flex: 1;
            padding: 10px 15px;
            border: none;
            border-radius: 10px;
            font-size: 0.95rem;
            outline: none;
            background: rgba(255, 255, 255, 0.95);
            color: #222;
        }

        .check-btn {
            background: var(--white);
            color: var(--primary-purple);
            border: none;
            padding: 10px 16px;
            border-radius: 10px;
            font-weight: 700;
            font-size: 0.9rem;
            cursor: pointer;
            transition: background 0.2s;
        }

        .check-btn:hover {
            background: #f0ebff;
        }

        .result-box {
            margin-top: 10px;
            padding: 10px 15px;
            border-radius: 10px;
            font-size: 0.9rem;
            display: none;
        }

        .result-box.correct {
            background: rgba(46, 213, 115, 0.2);
            color: #dfffef;
            border: 1px solid #2ed573;
        }

        .result-box.incorrect {
            background: rgba(255, 71, 87, 0.2);
            color: #ffe5e8;
            border: 1px solid #ff4757;
        }

        .answer-reveal {
            margin-top: 5px;
            font-size: 0.85rem;
            opacity: 0.95;
            font-style: italic;
        }

        .no-selection {
            text-align: center;
            padding: 30px;
            opacity: 0.8;
            font-size: 0.95rem;
        }

        @media (max-width: 480px) {
            .container { padding: 20px 15px; }
            .input-group { flex-direction: column; }
            .check-btn { width: 100%; }
        }
    </style>
</head>

    <div class="container">
        <header>
            <p># 세 번째 루틴</p>
            <h1>나만의 문장 만들기</h1>
            <p>원하는 유닛을 선택하고 문제 수와 섞기 기능을 활용해 연습해보세요!</p>
        </header>

        <div class="control-box">
            <div class="control-header">
                <span class="title">학습 유닛 선택 (01~60):</span>
                <div class="btn-group">
                    <button id="studyModeBtn" class="top-btn" onclick="toggleStudyMode()">📖 학습하기</button>
                    <button class="top-btn" onclick="shuffleCurrentQuizzes()">🔀 문제 섞기</button>
                    <button class="top-btn" onclick="resetUnits()">선택 초기화</button>
                </div>
            </div>
            
            <div class="checkbox-group" id="checkboxGroup">
                <!-- 동적 체크박스 생성 -->
            </div>

            <!-- 출제 문제 수 조절 영역 (1문제 단위 스텝퍼 + 슬라이더 바) -->
            <div class="count-control-container">
                <div class="count-row">
                    <span class="title">출제 문제 수:</span>
                    <div class="stepper-group" id="stepperGroup" onwheel="handleWheel(event)">
                        <button class="stepper-btn" onclick="adjustCount(-1)">-</button>
                        <span id="countDisplay">5</span>
                        <button class="stepper-btn" onclick="adjustCount(1)">+</button>
                    </div>
                </div>
                <div class="range-slider-container">
                    <input type="range" id="countRange" min="1" max="1" value="5" oninput="onSliderInput(this.value)">
                </div>
            </div>
        </div>

        <div id="quizList" class="quiz-list">
            <!-- 동적 렌더링 -->
        </div>
    </div>

        let currentQuestionCount = 5;
        let isStudyMode = false;
        let randomizedQuizzes = [];

        function initCheckboxes() {
            const checkboxGroup = document.getElementById("checkboxGroup");
            checkboxGroup.innerHTML = "";

            const sortedUnits = Object.keys(quizData).sort((a, b) => parseInt(a) - parseInt(b));

            sortedUnits.forEach(unitKey => {
                const label = document.createElement("label");
                label.className = "checkbox-label";
                label.innerHTML = `
                    <input type="checkbox" name="unit" value="${unitKey}" onchange="onUnitsChanged()"> Unit ${unitKey}
                `;
                checkboxGroup.appendChild(label);
            });
            renderQuizzes();
        }

        function resetUnits() {
            const checkboxes = document.querySelectorAll('input[name="unit"]');
            checkboxes.forEach(cb => cb.checked = false);
            renderQuizzes();
        }

        function toggleStudyMode() {
            isStudyMode = !isStudyMode;
            const btn = document.getElementById("studyModeBtn");
            if (isStudyMode) {
                btn.classList.add("active");
                btn.innerText = "✏️ 퀴즈하기";
            } else {
                btn.classList.remove("active");
                btn.innerText = "📖 학습하기";
            }
            renderQuizzes();
        }

        function onUnitsChanged() {
            prepareQuizzes();
            renderQuizzes();
        }

        function shuffleCurrentQuizzes() {
            prepareQuizzes(true); // force shuffle
            renderQuizzes();
        }

        function adjustCount(amount) {
            currentQuestionCount += amount;
            if (currentQuestionCount < 1) currentQuestionCount = 1;

            const checkedUnits = Array.from(document.querySelectorAll('input[name="unit"]:checked')).map(cb => cb.value);
            let totalAvailable = 0;
            checkedUnits.forEach(u => {
                if (quizData[u]) totalAvailable += quizData[u].length;
            });

            if (totalAvailable > 0 && currentQuestionCount > totalAvailable) {
                currentQuestionCount = totalAvailable;
            }

            updateCountUI();
            renderQuizzes();
        }

        function onSliderInput(val) {
            currentQuestionCount = parseInt(val);
            updateCountUI();
            renderQuizzes();
        }

        function updateCountUI() {
            const checkedUnits = Array.from(document.querySelectorAll('input[name="unit"]:checked')).map(cb => cb.value);
            let totalAvailable = 0;
            checkedUnits.forEach(u => {
                if (quizData[u]) totalAvailable += quizData[u].length;
            });

            const range = document.getElementById("countRange");
            range.max = totalAvailable > 0 ? totalAvailable : 1;
            if (currentQuestionCount > range.max) {
                currentQuestionCount = range.max;
            }
            if (currentQuestionCount < 1 && totalAvailable > 0) {
                currentQuestionCount = 1;
            }
            range.value = currentQuestionCount;
            document.getElementById("countDisplay").innerText = currentQuestionCount;
        }

        function handleWheel(event) {
            event.preventDefault();
            if (event.deltaY < 0) {
                adjustCount(1);
            } else {
                adjustCount(-1);
            }
        }

        function prepareQuizzes(forceShuffle = false) {
            const checkedUnits = Array.from(document.querySelectorAll('input[name="unit"]:checked')).map(cb => cb.value);
            let allQuizzes = [];
            checkedUnits.forEach(unitKey => {
                if (quizData[unitKey]) {
                    quizData[unitKey].forEach(q => {
                        allQuizzes.push({ ...q, unitKey: unitKey });
                    });
                }
            });

            if (isStudyMode && !forceShuffle) {
                randomizedQuizzes = allQuizzes;
            } else {
                let shuffled = [...allQuizzes];
                for (let i = shuffled.length - 1; i > 0; i--) {
                    const j = Math.floor(Math.random() * (i + 1));
                    [shuffled[i], shuffled[j]] = [shuffled[j], shuffled[i]];
                }
                randomizedQuizzes = shuffled;
            }

            updateCountUI();
        }

        function renderQuizzes() {
            const checkedUnits = Array.from(document.querySelectorAll('input[name="unit"]:checked')).map(cb => cb.value);
            const quizListContainer = document.getElementById("quizList");
            
            quizListContainer.innerHTML = "";

            if (checkedUnits.length === 0) {
                quizListContainer.innerHTML = `<div class="no-selection">학습할 유닛을 하나 이상 선택해주세요!</div>`;
                return;
            }

            prepareQuizzes();

            const limitedQuizzes = randomizedQuizzes.slice(0, currentQuestionCount);

            let globalIndex = 1;
            limitedQuizzes.forEach((quiz) => {
                const card = document.createElement("div");
                card.className = "quiz-card";

                if (isStudyMode) {
                    card.innerHTML = `
                        <div class="badge-group">
                            <span class="badge badge-unit">Unit ${quiz.unitKey}</span>
                            <span class="badge">${quiz.source}</span>
                        </div>
                        <div class="question-text">Q${globalIndex++}. ${quiz.question}</div>
                        <div class="study-answer-box">
                            💡 정답: ${quiz.answer}
                        </div>
                    `;
                } else {
                    card.innerHTML = `
                        <div class="badge-group">
                            <span class="badge badge-unit">Unit ${quiz.unitKey}</span>
                            <span class="badge">${quiz.source}</span>
                        </div>
                        <div class="question-text">Q${globalIndex++}. ${quiz.question}</div>
                        <div class="input-group">
                            <input type="text" id="input-${quiz.unitKey}-${quiz.id}" placeholder="여기에 영어 문장을 입력하세요...">
                            <button class="check-btn" onclick="checkAnswer('${quiz.unitKey}', ${quiz.id})">정답 확인</button>
                        </div>
                        <div id="result-${quiz.unitKey}-${quiz.id}" class="result-box"></div>
                    `;
                }
                quizListContainer.appendChild(card);
            });
        }

        function checkAnswer(unit, id) {
            const inputElem = document.getElementById(`input-${unit}-${id}`);
            const resultElem = document.getElementById(`result-${unit}-${id}`);
            const userVal = inputElem.value.trim().toLowerCase();
            
            const quiz = quizData[unit].find(q => q.id === id);
            const correctVal = quiz.answer.trim().toLowerCase();

            resultElem.style.display = "block";

            if (userVal === correctVal || userVal === correctVal.replace('.', '')) {
                resultElem.className = "result-box correct";
                resultElem.innerHTML = `🎉 정답입니다! <div class="answer-reveal">정답: ${quiz.answer}</div>`;
            } else {
                resultElem.className = "result-box incorrect";
                resultElem.innerHTML = `❌ 아쉽네요. 다시 시도해 보세요! <div class="answer-reveal">정답: ${quiz.answer}</div>`;
            }
        }

        window.onload = function() {
            initCheckboxes();
            updateCountUI();
        };
